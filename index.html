<!doctype html>
<html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1b38"><title>TAKE OVER | Esports Tournament Manager</title><style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#16213c;background:#f5f7fc}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}header{background:#102344;color:white;position:sticky;top:0;z-index:5}.bar{max-width:1100px;margin:auto;padding:16px 20px;display:flex;align-items:center;gap:14px}.brand{font-size:24px;font-weight:900;letter-spacing:-1px}.brand span{color:#f54298}.sub{font-size:10px;letter-spacing:2px;opacity:.7}.bar .grow{flex:1}.hdrbtn{background:#263c60;border:0;color:white;padding:9px 13px;border-radius:10px}.layout{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:225px minmax(0,1fr);gap:24px;padding:25px 20px}.side{position:sticky;top:90px;align-self:start}.nav{display:block;width:100%;text-align:left;padding:12px 14px;background:transparent;border:0;border-radius:12px;color:#51617d;font-weight:700;margin-bottom:5px}.nav.active{background:#142b57;color:white}.pane{min-width:0}.headrow{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap}h1{font-size:26px;margin:0}h2{font-size:19px;margin:0 0 13px}h3{font-size:17px;margin:0}.muted{color:#7e8aa3}.small{font-size:12px}.btn{background:#224cdb;border:0;color:white;border-radius:11px;padding:11px 16px;font-weight:750}.btn.alt{background:white;color:#203456;border:1px solid #dfe5f0}.btn.pink{background:#e92e89}.card{background:white;border:1px solid #e5e9f3;border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 4px 17px #1d2b4e08}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.game{border:1px solid #e0e7f2;background:white;border-radius:16px;padding:20px 12px;text-align:center;font-weight:750;min-height:105px}.game i{display:block;font-size:29px;font-style:normal;margin-bottom:9px}.game.selected{border:2px solid #e92e89;background:#fff5fa}.hero{padding:25px;border-radius:17px;color:white;background:linear-gradient(115deg,#132b57,#224b9c 65%,#7f2d8d);margin-bottom:20px}.hero h1{font-size:32px}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:16px}.chip{white-space:nowrap;background:white;border:1px solid #e0e5f0;border-radius:28px;padding:10px 14px;color:#465773;font-weight:650}.chip.active{background:#122a54;color:white}.entry{display:flex;gap:13px;align-items:center}.emblem{height:54px;width:54px;border-radius:12px;background:#dce8ff;display:grid;place-items:center;font-size:26px;flex-shrink:0}.entry .grow{flex:1;min-width:0}.entry h3{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tag{display:inline-block;background:#eff4fe;color:#3554aa;font-size:11px;font-weight:800;border-radius:7px;padding:5px 8px}.tag.live{background:#fee2e8;color:#bd2051}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}label{display:block;font-size:12px;font-weight:800;color:#5a6983;margin-bottom:7px}input,select{border:1px solid #d9e1ee;border-radius:10px;padding:12px;background:white;width:100%;color:#1c2b48}.full{grid-column:1/-1}.section{margin-top:25px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.score{font-weight:900;font-size:23px}.fixture{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;margin:14px 0}.fixture>:last-child{text-align:right}.empty{text-align:center;padding:40px 18px}.bottom{display:none}.hide{display:none!important}@media(max-width:800px){.layout{display:block;padding:18px 13px 95px}.side{display:none}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.bar{padding:12px 15px}.hero{padding:20px}.hero h1{font-size:26px}.bottom{display:flex;position:fixed;z-index:8;bottom:0;left:0;right:0;justify-content:space-around;background:white;border-top:1px solid #e2e7f1;padding:9px 3px max(10px,env(safe-area-inset-bottom))}.bottom button{background:none;border:0;font-size:11px;color:#63738e;font-weight:800;padding:4px}.bottom button.active{color:#2154d5}.fields{grid-template-columns:1fr}.card{padding:15px}}
</style></head><body><header><div class="bar"><div><div class="brand">TAKE <span>OVER</span></div><div class="sub">ESPORTS TOURNAMENT MANAGEMENT</div></div><div class="grow"></div><button class="hdrbtn" id="role">Demo: Admin ▾</button></div></header><div class="layout"><aside class="side" id="sidebar"></aside><main class="pane" id="app"></main></div><nav class="bottom" id="bottom"></nav>
<script>
const games=[['PUBG Mobile','🪖'],['Mobile Legends: Bang Bang','⚔️'],['eFootball Mobile','⚽'],['eFootball Console','🎮'],['FC 27','🏟️'],['Gran Turismo 7','🏎️'],['Tekken 8','🥊']];
const menu=[['home','⌂','Home'],['discover','⌕','Discover'],['tournaments','🏆','Tournaments'],['organizers','♙','Organizers'],['admin','⚙','Admin']];
const starter=[{id:'lec',name:'Labuan eFootball Championship',game:'eFootball Console',org:'MAIDA ESPORTS',format:'League + Knockout',status:'ONGOING',teams:['LABUAN FT','MAIDA FC','BORNEO XI','ELITE GAMING'],matches:[{home:'LABUAN FT',away:'MAIDA FC',a:2,b:1,status:'FULL TIME'}]},{id:'pm',name:'Labuan PUBG Mobile Cup',game:'PUBG Mobile',org:'MAIDA ESPORTS',format:'League',status:'PREPARATION',teams:[],matches:[]},{id:'ml',name:'Borneo MLBB Open',game:'Mobile Legends: Bang Bang',org:'GIT ESPORTS',format:'Knockout',status:'PREPARATION',teams:[],matches:[]}];
let state;try{state=JSON.parse(localStorage.getItem('takeover-demo-v1'))}catch{}if(!state||!Array.isArray(state.tournaments))state={tournaments:starter,organizers:['MAIDA ESPORTS','GIT ESPORTS']};
let tab='home',filter='All',selected=null,chosen=games[0][0],role='Admin';
const app=document.getElementById('app');const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>localStorage.setItem('takeover-demo-v1',JSON.stringify(state));const gameIcon=g=>games.find(x=>x[0]===g)?.[1]||'🏆';const bt=(s,a='')=>'<button class="btn '+a+'"';
const nav=()=>{document.getElementById('sidebar').innerHTML=menu.map(m=>'<button class="nav '+(tab===m[0]?'active':'')+'" onclick="go(\''+m[0]+'\')">'+m[1]+' &nbsp; '+m[2]+'</button>').join('');document.getElementById('bottom').innerHTML=menu.map(m=>'<button class="'+(tab===m[0]?'active':'')+'" onclick="go(\''+m[0]+'\')"><div style="font-size:21px">'+m[1]+'</div>'+m[2]+'</button>').join('');document.getElementById('role').textContent='Demo: '+role+' ▾'};
window.go=(s)=>{tab=s;selected=null;render();window.scrollTo(0,0)};window.setFilter=(s)=>{filter=s;render()};window.openTournament=id=>{selected=id;render();window.scrollTo(0,0)};window.chooseGame=g=>{chosen=g;render()};
window.switchRole=()=>{role=role==='Admin'?'Organizer':role==='Organizer'?'Viewer':'Admin';nav();render()};document.getElementById('role').onclick=switchRole;
function tournamentList(items){return items.length?items.map(t=>'<article class="card entry" onclick="openTournament(\''+esc(t.id)+'\')" style="cursor:pointer"><div class="emblem">'+gameIcon(t.game)+'</div><div class="grow"><h3>'+esc(t.name)+'</h3><div class="muted small">'+esc(t.org)+' · '+esc(t.game)+'</div><div style="margin-top:7px"><span class="tag '+(t.status==='LIVE'?'live':'')+'">'+esc(t.status)+'</span></div></div><strong>›</strong></article>').join(''):'<div class="card empty muted">Belum ada kejohanan untuk pilihan ini.</div>'}
function gameGrid(){return '<div class="grid">'+games.map(g=>'<button class="game '+(chosen===g[0]?'selected':'')+'" onclick="chooseGame(\''+g[0]+'\')"><i>'+g[1]+'</i>'+esc(g[0])+'</button>').join('')+'</div>'}
function home(){return '<div class="hero"><div class="small">WELCOME TO TAKE OVER</div><h1>One platform.<br>Every competition.</h1><p>Urus kejohanan esports, jadual dan kedudukan dalam satu tempat.</p><button class="btn pink" onclick="go(\'tournaments\')">Explore Tournaments →</button></div><div class="headrow"><h2>Esports Titles</h2><button class="btn alt" onclick="go(\'discover\')">View all</button></div>'+gameGrid()+'<div class="section"><h2>Featured Tournaments</h2>'+tournamentList(state.tournaments.slice(0,4))+'</div>'}
function discover(){const items=filter==='All'?state.tournaments:state.tournaments.filter(t=>t.game===filter);return '<div class="headrow"><h1>Discover</h1><span class="muted">'+items.length+' tournaments</span></div><div class="tabs">'+['All',...games.map(x=>x[0])].map(x=>'<button class="chip '+(filter===x?'active':'')+'" onclick="setFilter(\''+x+'\')">'+esc(x)+'</button>').join('')+'</div>'+tournamentList(items)}
function tour(){return '<div class="headrow"><h1>My Tournaments</h1><button class="btn" onclick="go(\'create\')">+ Create Tournament</button></div>'+tournamentList(state.tournaments)}
function organizers(){return '<div class="headrow"><h1>Organizers</h1></div>'+state.organizers.map((o,i)=>'<div class="card entry"><div class="emblem">🏢</div><div class="grow"><h3>'+esc(o)+'</h3><div class="muted small">'+state.tournaments.filter(t=>t.org===o).length+' tournaments</div></div></div>').join('')+'<p class="muted small">Multi-organizer ini merupakan simulasi UI. Pengasingan akaun dan kawalan akses sebenar memerlukan backend.</p>'}
function create(){return '<div class="headrow"><h1>Create Tournament</h1><button class="btn alt" onclick="go(\'tournaments\')">Cancel</button></div><div class="card"><h2>1. Tournament Type</h2><div class="tabs"><span class="chip active">Single Tournament</span><span class="chip">Multiple Categories (coming later)</span></div><h2>2. Select Game</h2>'+gameGrid()+'<form id="newform" class="section"><h2>3. Tournament Details</h2><div class="fields"><div class="full"><label>TOURNAMENT NAME</label><input name="name" required maxlength="90" placeholder="e.g. TAKE OVER Championship"></div><div><label>ORGANIZER</label><select name="org">'+state.organizers.map(o=>'<option>'+esc(o)+'</option>').join('')+'</select></div><div><label>FORMAT</label><select name="format"><option>League</option><option>Knockout</option><option>League + Knockout</option></select></div><div><label>STATUS</label><select name="status"><option>PREPARATION</option><option>ONGOING</option><option>COMPLETED</option></select></div><div style="align-self:end"><button class="btn" style="width:100%">Create Tournament</button></div></div></form><p class="muted small">Borang pendaftaran peserta/pasukan belum diaktifkan.</p></div>'}
function detail(){const t=state.tournaments.find(x=>x.id===selected);if(!t)return tour();return '<button class="btn alt" onclick="go(\'tournaments\')">← All Tournaments</button><div class="hero section"><div>'+gameIcon(t.game)+' '+esc(t.game)+'</div><h1>'+esc(t.name)+'</h1><p>'+esc(t.org)+' · '+esc(t.format)+'</p><span class="tag">'+esc(t.status)+'</span></div><div class="grid"><div class="card"><div class="muted small">TEAMS</div><h1>'+t.teams.length+'</h1></div><div class="card"><div class="muted small">MATCHES</div><h1>'+t.matches.length+'</h1></div><div class="card"><div class="muted small">GAME</div><h3>'+esc(t.game)+'</h3></div></div><section class="section"><h2>Matches</h2>'+(t.matches.length?t.matches.map(m=>'<div class="card"><div class="row small muted"><span>Matchday</span><span class="tag">'+esc(m.status)+'</span></div><div class="fixture"><b>'+esc(m.home)+'</b><div class="score">'+(m.a??'-')+' : '+(m.b??'-')+'</div><b>'+esc(m.away)+'</b></div></div>').join(''):'<div class="card empty muted">Jadual perlawanan belum disediakan.</div>')+'</section><section class="section"><h2>Teams & Standings</h2>'+(t.teams.length?t.teams.map((n,i)=>'<div class="card row"><span><b>'+String(i+1).padStart(2,'0')+'</b> &nbsp; '+esc(n)+'</span><span class="muted">—</span></div>').join(''):'<div class="card empty muted">Belum ada pasukan. Pendaftaran masih ditangguhkan.</div>')+'</section><p class="muted small">Ranking automatik, skor live dan statistik lanjutan akan diaktifkan dalam pembangunan seterusnya.</p>'}
function admin(){return '<div class="headrow"><h1>Dashboard</h1><span class="tag">'+role+' Demo</span></div><div class="grid"><div class="card"><div class="muted small">Tournaments</div><h1>'+state.tournaments.length+'</h1></div><div class="card"><div class="muted small">Organizers</div><h1>'+state.organizers.length+'</h1></div><div class="card"><div class="muted small">Esports Titles</div><h1>7</h1></div></div><div class="card section"><h2>Management</h2><p>Urus kejohanan, format pertandingan dan paparan umum. Akses Admin / Organizer / Viewer pada halaman ini adalah simulasi sahaja.</p><button class="btn" onclick="go(\'create\')">+ New Tournament</button> <button class="btn alt" onclick="resetDemo()">Reset Demo</button></div><div class="card"><h2>Development Roadmap</h2><p>✓ Responsive UI &nbsp; ✓ 7 Esports Titles &nbsp; ✓ Tournament Creation</p><p>○ Cloudflare Authentication &nbsp; ○ D1 Database &nbsp; ○ Advanced Brackets</p><p class="muted">Public registration: ON HOLD</p></div>'}
window.resetDemo=()=>{if(confirm('Reset semua data demo dalam pelayar ini?')){localStorage.removeItem('takeover-demo-v1');location.reload()}};
function render(){nav();app.innerHTML=selected?detail():tab==='home'?home():tab==='discover'?discover():tab==='tournaments'?tour():tab==='organizers'?organizers():tab==='create'?create():admin();const form=document.getElementById('newform');if(form)form.onsubmit=e=>{e.preventDefault();const d=new FormData(form);const name=String(d.get('name')).trim();if(!name)return;const id='t'+Date.now();state.tournaments.unshift({id,name,game:chosen,org:String(d.get('org')),format:String(d.get('format')),status:String(d.get('status')),teams:[],matches:[]});save();tab='tournaments';selected=id;render()}}
render();
</script></body></html>
