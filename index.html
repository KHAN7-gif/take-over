more:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>'
};return '<svg class="td-svg" xmlns="http://www.w3.org/2000/svg" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(paths[name]||paths.home)+'</svg>'}
function detail(){
const t=state.tournaments.find(x=>x.id===selected);if(!t)return tour();
const theme=gameThemes[t.game]||['#1a3262','#5372b6','🏆','ESPORTS'];
const tabs=[['home','Home'],['matches','Matches'],['teams','Teams'],['bracket','Bracket']];
const followed=Boolean(state.followed&&state.followed[t.id]);
return '<div class="tournament-page" style="--banner-a:'+theme[0]+';--banner-b:'+theme[1]+'">'+
'<div class="td-header"><div class="td-top"><button aria-label="Back" onclick="go(\'tournaments\')">'+tournamentSvg('back')+'</button><span>'+esc(t.name)+'</span><button aria-label="Share tournament" onclick="shareTournament()">'+tournamentSvg('share')+'</button><button aria-label="Tournament settings" onclick="openTournamentSettings()">'+tournamentSvg('more')+'</button></div>'+
'<div class="td-tabs" role="tablist" aria-label="Tournament navigation">'+tabs.map(x=>'<button type="button" role="tab" aria-selected="'+(detailTab===x[0]?'true':'false')+'" class="'+(detailTab===x[0]?'active':'')+'" onclick="openDetailTab(\''+x[0]+'\')">'+tournamentSvg(x[0])+'</button>').join('')+'</div></div>'+
'<div class="td-banner"><div class="td-banner-mark">'+theme[2]+'</div><div class="td-banner-stripes"></div><div class="td-banner-category">'+theme[3]+'</div><div class="td-banner-name">'+esc(t.game)+'</div></div>'+
'<div class="td-card"><div class="td-avatar">'+gameIcon(t.game)+'</div><button class="td-follow '+(followed?'following':'')+'" onclick="toggleFollow()">'+(followed?'✓ Following':'+ Follow')+'</button>'+
detailPanel(t)+'</div></div>';
}
function admin(){return '<div class="headrow"><h1>Dashboard</h1><span class="tag">'+role+' Demo</span></div><div class="grid"><div class="card"><div class="muted small">Tournaments</div><h1>'+state.tournaments.length+'</h1></div><div class="card"><div class="muted small">Organizers</div><h1>'+state.organizers.length+'</h1></div><div class="card"><div class="muted small">Esports Titles</div><h1>7</h1></div></div><div class="card section"><h2>Management</h2><p>Urus kejohanan, format pertandingan dan paparan umum. Akses Admin / Organizer / Viewer pada halaman ini adalah simulasi sahaja.</p><button class="btn" onclick="openCreateType()">+ New Tournament</button> <button class="btn alt" onclick="resetDemo()">Reset Demo</button></div><div class="card"><h2>Development Roadmap</h2><p>✓ Responsive UI &nbsp; ✓ 7 Esports Titles &nbsp; ✓ Tournament Creation</p><p>○ Cloudflare Authentication &nbsp; ○ D1 Database &nbsp; ○ Advanced Brackets</p><p class="muted">Public registration: ON HOLD</p></div>'}
window.resetDemo=()=>{if(confirm('Reset semua data demo dalam pelayar ini?')){localStorage.removeItem('takeover-demo-v1');location.reload()}};

function typeModal(){return '<div class="modal-backdrop" onclick="closeCreateType()" role="presentation"><div class="type-modal" role="dialog" aria-modal="true" aria-label="Tournament type" onclick="event.stopPropagation()"><div class="modal-top"><span class="modal-icon">🏆</span><button class="modal-close" onclick="closeCreateType()" aria-label="Close">×</button></div><h2 class="modal-title">Tournament type</h2><p class="modal-description">Choose how the tournament will be organized.</p><button class="modal-option" onclick="selectSingleTournament()"><span class="modal-option-icon">🏆</span><span><strong>Single tournament</strong><small>Tournament of a single modality with only 1 category</small></span><span class="modal-chevron">›</span></button><div class="modal-option is-disabled" aria-disabled="true"><span class="modal-option-icon">✣</span><span><strong>Tournament with categories <em class="soon">Coming Soon</em></strong><small>Tournament with more than one category. Different games, divisions or other categories.</small></span><span class="modal-lock">🔒</span></div><button class="modal-cancel" onclick="closeCreateType()">Cancel</button></div></div>'}
function esportsCategoryModal(){return '<div class="modal-backdrop" onclick="closeCreateType()" role="presentation"><div class="type-modal" role="dialog" aria-modal="true" aria-label="Select esports category" onclick="event.stopPropagation()"><div class="modal-top"><span class="modal-icon">🎮</span><button class="modal-close" onclick="closeCreateType()" aria-label="Close">×</button></div><h2 class="modal-title">Select the modality</h2><p class="modal-description">Choose the esports category for your tournament.</p><div class="esports-options">'+esportsCategories.map((c,i)=>'<button class="esports-choice" onclick="selectEsportsCategory('+i+')"><span class="esports-symbol">'+c[1]+'</span><strong>'+esc(c[0])+'</strong><span class="modal-chevron">›</span></button>').join('')+'</div><button class="modal-cancel" onclick="openCreateType()">← Back</button></div></div>'}
function esportsGameModal(){const c=esportsCategories.find(x=>x[0]===selectedCategory);const titles=c?c[2]:[];return '<div class="modal-backdrop" onclick="closeCreateType()" role="presentation"><div class="type-modal" role="dialog" aria-modal="true" aria-label="Select game title" onclick="event.stopPropagation()"><div class="modal-top"><span class="modal-icon">🎮</span><button class="modal-close" onclick="closeCreateType()" aria-label="Close">×</button></div><h2 class="modal-title">Select game title</h2><p class="modal-description">'+esc(selectedCategory)+' · Choose your esports title.</p><div class="esports-options">'+(titles.length?titles.map(g=>'<button class="esports-choice" onclick="selectEsportsGame(\''+g+'\')"><span class="esports-symbol">'+gameIcon(g)+'</span><strong>'+esc(g)+'</strong><span class="modal-chevron">›</span></button>').join(''):'<div class="card empty muted">Coming Soon — no titles available for this category.</div>')+'</div><button class="modal-cancel" onclick="backEsportsStep()">← Back to categories</button></div></div>'}
function render(){document.body.classList.toggle('in-tournament',Boolean(selected));nav();app.innerHTML=selected?(settingsOpen?settingsPage():detail()):tab==='home'?home():tab==='discover'?discover():tab==='tournaments'?tour():tab==='organizers'?organizers():tab==='create'?create():admin();app.innerHTML+=tournamentTypeOpen?typeModal():creationStep==='category'?esportsCategoryModal():creationStep==='game'?esportsGameModal():'';app.innerHTML+=shareOpen?shareSheet():'';const form=document.getElementById('newform');if(form)form.onsubmit=e=>{e.preventDefault();const d=new FormData(form);const name=String(d.get('name')).trim();if(!name)return;const id='t'+Date.now();state.tournaments.unshift({id,name,game:chosen,org:String(d.get('org')),format:String(d.get('format')),status:String(d.get('status')),teams:[],matches:[]});save();tab='tournaments';selected=id;render()}}
const initialId=decodeURIComponent(location.hash.replace(/^#tournament=/,''));if(location.hash.startsWith('#tournament=')&&state.tournaments.some(t=>t.id===initialId)){selected=initialId;detailTab='home'}
window.addEventListener('hashchange',()=>{const id=decodeURIComponent(location.hash.replace(/^#tournament=/,''));if(location.hash.startsWith('#tournament=')&&state.tournaments.some(t=>t.id===id)){selected=id;detailTab='home';shareOpen=false;render()}else if(selected){selected=null;shareOpen=false;render()}});
render();
</script></body></html>
